name: collect

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub's minimum; real runs often land every 5-15 min
  workflow_dispatch:       # "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Sparse checkout: only pull the collector and mayor log, not the
      # thousands of old snapshot files, so runs stay fast as data piles up.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            collector
            data/mayor.csv
          sparse-checkout-cone-mode: false

      - name: Fetch snapshot
        run: python3 collector/collect.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse data
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
